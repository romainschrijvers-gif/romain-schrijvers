<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Preview — Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    .toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: #1a1d2e; border-bottom: 1px solid #2d3148;
      padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }

    .toolbar h1 { font-size: 14px; font-weight: 600; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }

    .device-buttons { display: flex; gap: 6px; flex-wrap: wrap; }

    .device-btn {
      background: #2d3148; border: 1px solid #3d4260; color: #94a3b8;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .device-btn:hover { background: #3d4260; color: #e2e8f0; }
    .device-btn.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }

    .custom-size {
      display: flex; align-items: center; gap: 6px; margin-left: auto;
      font-size: 12px; color: #64748b;
    }
    .custom-size input {
      width: 60px; padding: 5px 8px; background: #2d3148; border: 1px solid #3d4260;
      border-radius: 4px; color: #e2e8f0; font-size: 12px; text-align: center;
    }
    .custom-size input:focus { outline: none; border-color: #3b82f6; }

    .page-selector {
      display: flex; gap: 6px; align-items: center;
    }
    .page-selector label { font-size: 12px; color: #64748b; }
    .page-selector select {
      padding: 5px 10px; background: #2d3148; border: 1px solid #3d4260;
      border-radius: 4px; color: #e2e8f0; font-size: 12px; cursor: pointer;
    }
    .page-selector select:focus { outline: none; border-color: #3b82f6; }

    .rotate-btn {
      background: #2d3148; border: 1px solid #3d4260; color: #94a3b8;
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
      transition: all 0.2s ease;
    }
    .rotate-btn:hover { background: #3d4260; color: #e2e8f0; }

    .preview-area {
      display: flex; justify-content: center; align-items: flex-start;
      padding-top: 80px; min-height: 100vh;
    }

    .device-frame {
      background: #1e2030; border: 2px solid #3d4260; border-radius: 16px;
      overflow: hidden; transition: width 0.4s ease, height 0.4s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      margin: 20px;
    }

    .device-frame iframe {
      width: 100%; height: 100%; border: none; background: #fff;
    }

    .device-label {
      text-align: center; padding: 8px; font-size: 11px; color: #64748b;
      letter-spacing: 0.05em; text-transform: uppercase;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <h1>Preview</h1>

    <div class="page-selector">
      <label for="page-select">Page :</label>
      <select id="page-select">
        <option value="index.html">Accueil (Portfolio)</option>
        <option value="projet.html?id=cea">Projet — CEA</option>
        <option value="projet.html?id=atexo">Projet — ATEXO</option>
        <option value="projet.html?id=provexi">Projet — PROVEXI</option>
        <option value="projet.html?id=socotec">Projet — SOCOTEC</option>
        <option value="projet.html?id=pb">Projet — Parkhouse Bell</option>
        <option value="projet.html?id=propale-bot">Projet — Propale Bot</option>
        <option value="projet.html?id=capteurs-iot">Projet — IoT</option>
      </select>
    </div>

    <div class="device-buttons" id="device-buttons">
      <button class="device-btn" data-w="375" data-h="812" data-label="iPhone SE">iPhone SE</button>
      <button class="device-btn" data-w="390" data-h="844" data-label="iPhone 14">iPhone 14</button>
      <button class="device-btn" data-w="430" data-h="932" data-label="iPhone 15 Pro Max">iPhone 15 PM</button>
      <button class="device-btn" data-w="768" data-h="1024" data-label="iPad Mini">iPad Mini</button>
      <button class="device-btn" data-w="810" data-h="1080" data-label="iPad 10th">iPad 10th</button>
      <button class="device-btn" data-w="1024" data-h="1366" data-label="iPad Pro 12.9">iPad Pro 12.9</button>
      <button class="device-btn" data-w="1280" data-h="800" data-label="Laptop 13&quot;">Laptop 13"</button>
      <button class="device-btn active" data-w="1440" data-h="900" data-label="Laptop 15&quot;">Laptop 15"</button>
      <button class="device-btn" data-w="1920" data-h="1080" data-label="Desktop FHD">Desktop FHD</button>
    </div>

    <button class="rotate-btn" id="rotate-btn" title="Rotation">↻</button>

    <div class="custom-size">
      <input type="number" id="custom-w" placeholder="W" min="280" max="2560">
      ×
      <input type="number" id="custom-h" placeholder="H" min="400" max="2560">
    </div>
  </div>

  <div class="preview-area">
    <div class="device-frame" id="device-frame">
      <div class="device-label" id="device-label">Laptop 15" — 1440×900</div>
      <iframe id="preview-iframe" src="index.html"></iframe>
    </div>
  </div>

  <script>
    var frame = document.getElementById('device-frame');
    var iframe = document.getElementById('preview-iframe');
    var label = document.getElementById('device-label');
    var buttons = document.querySelectorAll('.device-btn');
    var customW = document.getElementById('custom-w');
    var customH = document.getElementById('custom-h');
    var pageSelect = document.getElementById('page-select');
    var rotateBtn = document.getElementById('rotate-btn');

    var currentW = 1440, currentH = 900;
    var isRotated = false;

    function setSize(w, h, labelText) {
      currentW = w; currentH = h;
      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      label.textContent = (labelText || '') + ' — ' + w + '×' + h;
      customW.value = w;
      customH.value = h;
    }

    /* Device buttons */
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        isRotated = false;
        setSize(parseInt(btn.dataset.w), parseInt(btn.dataset.h), btn.dataset.label);
      });
    });

    /* Custom size */
    function applyCustom() {
      var w = parseInt(customW.value) || 1440;
      var h = parseInt(customH.value) || 900;
      buttons.forEach(function (b) { b.classList.remove('active'); });
      setSize(w, h, 'Custom');
    }
    customW.addEventListener('change', applyCustom);
    customH.addEventListener('change', applyCustom);

    /* Page selector */
    pageSelect.addEventListener('change', function () {
      iframe.src = pageSelect.value;
    });

    /* Rotate */
    rotateBtn.addEventListener('click', function () {
      isRotated = !isRotated;
      setSize(currentH, currentW, label.textContent.split(' — ')[0]);
    });

    /* Init */
    setSize(1440, 900, 'Laptop 15"');
  </script>
</body>
</html>
